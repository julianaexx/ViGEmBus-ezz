name: Build ViGEmBus

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      driver_run_id:
        description: 'Reuse compiled driver from a successful run of this repository (packaging-only changes)'
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build-x64:
    if: ${{ inputs.driver_run_id == '' }}
    runs-on: windows-2022

    steps:
      - name: Check out source and SDK
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Read Windows compatibility target
        shell: pwsh
        run: |
          $compatibility = Get-Content setup/compatibility.json -Raw | ConvertFrom-Json
          "VIGEM_KMDF_MAJOR=$($compatibility.kmdfVersion.Split('.')[0])" | Out-File $env:GITHUB_ENV -Append
          "VIGEM_KMDF_MINOR=$($compatibility.kmdfVersion.Split('.')[1])" | Out-File $env:GITHUB_ENV -Append
          "VIGEM_MIN_WINDOWS_VERSION=$($compatibility.minimumWindowsVersion)" | Out-File $env:GITHUB_ENV -Append

      - name: Fetch DMF
        shell: pwsh
        run: |
          $dmfRoot = Join-Path $env:RUNNER_TEMP 'DMF'
          "DMF_ROOT_PATH=$dmfRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          git clone --depth 1 https://github.com/microsoft/DMF.git "$dmfRoot"

      - name: Build DMF
        shell: pwsh
        run: |
          msbuild "$env:DMF_ROOT_PATH\Dmf.sln" `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:LatestTargetPlatformVersion=10.0.26100.0 `
            /p:WindowsTargetPlatformVersion=10.0.26100.0 `
            /p:KMDF_VERSION_MAJOR=$env:VIGEM_KMDF_MAJOR `
            /p:KMDF_VERSION_MINOR=$env:VIGEM_KMDF_MINOR `
            /p:WindowsTargetPlatformMinVersion=$env:VIGEM_MIN_WINDOWS_VERSION `
            /p:SignMode=Off `
            /v:minimal

      - name: Build ViGEmBus
        shell: pwsh
        run: |
          msbuild "$env:GITHUB_WORKSPACE\sys\ViGEmBus.vcxproj" `
            /t:Rebuild `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:DmfRootPath="$env:DMF_ROOT_PATH" `
            /p:SolutionDir="$env:GITHUB_WORKSPACE\" `
            /p:WindowsTargetPlatformVersion=10.0.26100.0 `
            /p:SkipInfVerification=true `
            /p:KMDF_VERSION_MAJOR=$env:VIGEM_KMDF_MAJOR `
            /p:KMDF_VERSION_MINOR=$env:VIGEM_KMDF_MINOR `
            /p:WindowsTargetPlatformMinVersion=$env:VIGEM_MIN_WINDOWS_VERSION `
            /p:SignMode=Off `
            /v:minimal

      - name: Save compiled driver
        uses: actions/upload-artifact@v4
        with:
          name: ViGEmBus-x64-compiled-driver
          path: bin/x64/ViGEmBus/ViGEmBus.sys
          if-no-files-found: error

  package-x64:
    needs: build-x64
    if: ${{ !cancelled() && (needs.build-x64.result == 'success' || inputs.driver_run_id != '') }}
    runs-on: windows-2022
    steps:
      - name: Check out installer source
        uses: actions/checkout@v4

      - name: Download compiled driver
        uses: actions/download-artifact@v4
        with:
          name: ViGEmBus-x64-compiled-driver
          path: bin/x64/ViGEmBus
          run-id: ${{ inputs.driver_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Check installation status detection
        shell: pwsh
        run: ./setup/tests/Driver-Status.Tests.ps1

      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }

      - name: Build and validate complete test-signed setup
        timeout-minutes: 5
        shell: pwsh
        run: ./setup/Build-Installer.ps1

      - name: Upload installer and driver package
        uses: actions/upload-artifact@v4
        with:
          name: ViGEmBus-x64-series-test-signed
          path: |
            artifacts/ViGEmBus_Setup_*_x64_TEST_SIGNED.exe
            artifacts/setup-payload/
          if-no-files-found: error
